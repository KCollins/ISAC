<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenOBS-328 VCNL4030 Deployment Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; max-width: 950px; background: #f8f9fa; }
    .status-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    button { padding: 10px 16px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; }
    #syncBtn { background: #28a745; color: white; border: none; }
    #syncBtn:disabled { background: #ccc; cursor: not-allowed; }
    .badge { padding: 8px 14px; border-radius: 5px; font-weight: bold; background: #e9ecef; font-size: 13px; }
    .synced { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .time-banner { background: #e7f1ff; color: #084298; border: 1px solid #b6d4fe; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; }
    .chart-box { height: 350px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 15px; }
    #terminal { background: #1e1e1e; color: #00ff66; font-family: monospace; padding: 12px; height: 130px; overflow-y: auto; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>

  <h2>OpenOBS-328 VCNL4030 Deployment Tool</h2>

  <div class="status-bar">
    <button id="connectBtn" onclick="toggleConnection()">1. Connect Serial</button>
    <button id="syncBtn" onclick="syncTime()" disabled>2. Sync Time & Start Log File</button>
    <span id="snBadge" class="badge">SN: Unknown</span>
    <span id="fileBadge" class="badge">File: Not Created</span>
  </div>

  <div class="time-banner">
    <span id="humanTimeDisplay">System Time Status: Unsynced</span>
    <span id="epochDisplay">UTC Epoch: 0</span>
  </div>

  <div class="chart-box">
    <canvas id="sensorChart"></canvas>
  </div>

  <h3>Serial Log</h3>
  <div id="terminal">Click "Connect Serial" to pair with OpenOBS-328 board...</div>

  <script>
    let port, reader, isConnected = false;
    let serialNumber = "Unknown";
    let activeStartEpoch = 0;
    let syncTimeLocal = 0;
    let clockInterval = null;

    const ctx = document.getElementById('sensorChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Proximity',
            data: [],
            borderColor: '#dc3545',
            backgroundColor: '#dc3545',
            yAxisID: 'yProx',
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.2,
            fill: false
          },
          {
            label: 'Lux (lx)',
            data: [],
            borderColor: '#0d6efd',
            backgroundColor: '#0d6efd',
            yAxisID: 'yLux',
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.2,
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: { display: true, title: { display: true, text: 'Time (UTC)' } },
          yProx: { 
            type: 'linear', 
            display: true, 
            position: 'left', 
            title: { display: true, text: 'Proximity (Counts)' },
            suggestedMin: 0
          },
          yLux: { 
            type: 'linear', 
            display: true, 
            position: 'right', 
            title: { display: true, text: 'Lux (lx)' }, 
            grid: { drawOnChartArea: false },
            suggestedMin: 0
          }
        }
      }
    });

    async function toggleConnection() {
      if (isConnected) { disconnect(); return; }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 57600 });

        isConnected = true;
        document.getElementById('connectBtn').innerText = "Disconnect";
        document.getElementById('syncBtn').disabled = false;
        logTerminal("Serial port connected at 57600 baud. Waiting for board boot...");

        // 1. Start listening to incoming serial stream immediately
        readSerialLoop();

        // 2. Wait 1.5s for MCU boot sequence to finish before requesting SN
        setTimeout(async () => {
          if (serialNumber === "Unknown") {
            await sendSerialCommand("GET_SN\n");
          }
        }, 1500);

      } catch (err) {
        logTerminal(`Connection Error: ${err.message}`);
      }
    }

    async function readSerialLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += value;
        let lines = buffer.split('\n');
        buffer = lines.pop();

        for (let line of lines) {
          line = line.trim();
          if (line.length > 0) processLine(line);
        }
      }
    }

    function triggerSyncUI(epoch, activeFileName) {
      activeStartEpoch = epoch;
      syncTimeLocal = Date.now();
      
      const fileBadge = document.getElementById('fileBadge');
      fileBadge.innerText = `File: ${activeFileName}`;
      fileBadge.classList.add('synced');

      chart.data.labels = [];
      chart.data.datasets[0].data = [];
      chart.data.datasets[1].data = [];
      chart.update('none');

      startLiveClock();
    }

    function processLine(line) {
      if (line.startsWith("ACK_SN:")) {
        serialNumber = line.split(":")[1];
        document.getElementById('snBadge').innerText = `SN: ${serialNumber}`;
        logTerminal(`Board Serial Number: ${serialNumber}`);
        return;
      }

      if (line.startsWith("ACK_SYNC:")) {
        const payload = line.split(":")[1];
        const parts = payload.split(',');
        const epoch = parseInt(parts[0]);
        const activeFileName = parts.length > 1 ? parts[1] : 'Created';

        triggerSyncUI(epoch, activeFileName);
        logTerminal(`-> Board Confirmed Sync (${epoch}). Active File: ${activeFileName}`);
        return;
      }

      if (line.startsWith("MSG:")) {
        logTerminal(line);
        return;
      }

      // Parse CSV Row: timestamp, millis, proximity, lux, als, white
      const parts = line.split(',');
      if (parts.length >= 4) {
        const epoch = parseInt(parts[0]);
        const prox = parseFloat(parts[2]); // Column 2 is Proximity
        const lux = parseFloat(parts[3]);  // Column 3 is Lux

        if (!isNaN(prox) && !isNaN(lux)) {
          const timeLabel = epoch > 1000000000 
            ? new Date(epoch * 1000).toLocaleTimeString('en-US', { timeZone: 'UTC' }) + ' UTC'
            : 'Unsynced';

          chart.data.labels.push(timeLabel);
          chart.data.datasets[0].data.push(prox);
          chart.data.datasets[1].data.push(lux);

          if (chart.data.labels.length > 40) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
            chart.data.datasets[1].data.shift();
          }

          chart.update('none');
        }
      }
    }

    function startLiveClock() {
      if (clockInterval) clearInterval(clockInterval);

      function updateClock() {
        const elapsedSec = Math.floor((Date.now() - syncTimeLocal) / 1000);
        const currentEpoch = activeStartEpoch + elapsedSec;
        const d = new Date(currentEpoch * 1000);

        const utcDateStr = d.toLocaleString('en-US', {
          timeZone: 'UTC',
          dateStyle: 'full',
          timeStyle: 'medium'
        }) + ' UTC';

        document.getElementById('humanTimeDisplay').innerHTML = `Synced UTC Time: <strong>${utcDateStr}</strong>`;
        document.getElementById('epochDisplay').innerHTML = `UTC Epoch: <strong>${currentEpoch}</strong>`;
      }

      updateClock();
      clockInterval = setInterval(updateClock, 1000);
    }

    async function syncTime() {
      if (!port || !port.writable) return;
      const epoch = Math.floor(Date.now() / 1000);
      await sendSerialCommand(`T${epoch}\n`);
      logTerminal(`Sent UTC Sync Command: T${epoch}`);
    }

    async function sendSerialCommand(cmd) {
      if (!port || !port.writable) return;
      const writer = port.writable.getWriter();
      await writer.write(new TextEncoder().encode(cmd));
      writer.releaseLock();
    }

    async function disconnect() {
      if (reader) await reader.cancel();
      if (port) await port.close();
      if (clockInterval) clearInterval(clockInterval);

      isConnected = false;
      document.getElementById('connectBtn').innerText = "1. Connect Serial";
      document.getElementById('syncBtn').disabled = true;
      logTerminal("Disconnected.");
    }

    function logTerminal(msg) {
      const term = document.getElementById('terminal');
      term.innerHTML += `<div>${msg}</div>`;
      term.scrollTop = term.scrollHeight;
    }
  </script>
</body>
</html>
